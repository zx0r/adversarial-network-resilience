# Hysteria 2 - Production Server Configuration
# Protocol: QUIC-based Transport with Brutal Congestion Control & Salamander Obfs

listen: :443

# TLS Configuration
tls:
  cert: /etc/hysteria/cert.crt
  key: /etc/hysteria/private.key

# Traffic Obfuscation (Salamander XOR)
obfs:
  type: salamander
  salamander:
    password: "CHANGE_THIS_TO_STRONG_SHARED_SECRET"

# Authentication
auth:
  type: password
  password: "CHANGE_THIS_TO_STRONG_USER_PASSWORD"

# Bandwidth Rate Management
bandwidth:
  up: 500 mbps
  down: 1 gbps

# Congestion Control Algorithm (bbr / brutal)
congestionControl: brutal

# Transport Options
masquerade:
  type: proxy
  proxy:
    url: https://www.bing.com
    rewriteHost: true

# Outbound Resolver
resolver:
  type: https
  https:
    addr: 1.1.1.1:443
    timeout: 4s

# Operational Logs
log:
  level: warn
