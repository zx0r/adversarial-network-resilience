name: Documentation Integrity

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    name: Validate Document Integrity & Anchors
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate TOC Anchors and Markdown Links
        run: |
          python3 -c "
          import os, re, sys

          with open('README.md', 'r', encoding='utf-8') as f:
              readme = f.read()

          toc_match = re.search(r'#### Table of Contents(.*?)(?=#### 1\.|\Z)', readme, re.DOTALL)
          if not toc_match:
              sys.exit('Error: Table of Contents not found in README.md')

          toc_text = toc_match.group(1)
          toc_links = re.findall(r'\[.*?\]\(#(.*?)\)', toc_text)
          missing_anchors = [a for a in toc_links if f'<a name=\"{a}\"></a>' not in readme]

          if missing_anchors:
              print(f'Missing TOC anchors: {missing_anchors}')
              sys.exit(1)

          md_files = ['README.md', 'docs/THREAT_MODEL.md', 'legal/COMPLIANCE.md']
          broken_links = []
          for md in md_files:
              if not os.path.exists(md):
                  continue
              with open(md, 'r', encoding='utf-8') as f:
                  content = f.read()
              rel_links = re.findall(r'\[.*?\]\((?!http|#|mailto:)(.*?)\)', content)
              for link in rel_links:
                  clean_link = link.split('#')[0]
                  if clean_link and not os.path.exists(clean_link):
                      broken_links.append((md, link))

          if broken_links:
              print(f'Broken file links: {broken_links}')
              sys.exit(1)

          print(f'✓ All {len(toc_links)} TOC anchors and relative file links validated successfully.')
          "
