version: '3.8'

services:
  # --- Network Impairment Emulator (WAN Node) ---
  wan-emulator:
    image: alpine:3.20
    container_name: mnp-wan-emulator
    cap_add:
      - NET_ADMIN
    command: >
      sh -c "
        apk add --no-cache iproute2 iptables &&
        echo 1 > /proc/sys/net/ipv4/ip_forward &&
        # Default baseline: 20ms RTT (10ms each direction), 0% loss
        tc qdisc add dev eth0 root netem delay 10ms &&
        echo 'WAN Emulator online. Emulation delay: 10ms.' &&
        tail -f /dev/null
      "
    networks:
      testbed-net:
        ipv4_address: 172.28.0.2

  # --- Protocol Server Endpoint ---
  server:
    image: ghcr.io/sagernet/sing-box:latest
    container_name: mnp-server
    volumes:
      - ../server_setup/singbox-server.json:/etc/sing-box/config.json:ro
    command: run -c /etc/sing-box/config.json
    networks:
      testbed-net:
        ipv4_address: 172.28.0.10
    depends_on:
      - wan-emulator

  # --- Benchmark Test Client & Metric Collector ---
  client:
    image: alpine:3.20
    container_name: mnp-benchmark-client
    cap_add:
      - NET_ADMIN
    volumes:
      - ./:/benchmarks
    command: >
      sh -c "
        apk add --no-cache iperf3 curl bash iproute2 jq &&
        tail -f /dev/null
      "
    networks:
      testbed-net:
        ipv4_address: 172.28.0.20
    depends_on:
      - server

networks:
  testbed-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
